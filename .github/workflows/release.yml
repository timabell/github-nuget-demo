name: Release

on:
  push:
    branches: [main]

# Prevent concurrent releases racing to create the same version tag
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  should-release-check:
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check_changes.outputs.should_release }}
      changelog: ${{ steps.changelog.outputs.content }}
      bump_type: ${{ steps.bump.outputs.type }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --unreleased --strip header

      - name: Detect bump type
        id: bump
        run: |
          BUMP_TYPE=$(.github/workflows/detect-bump.sh)
          echo "type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Explicit bump type: ${BUMP_TYPE:-none}"

      - name: Check for release-worthy changes
        id: check_changes
        # git-cliff only includes section headers (###) when there are conventional commits - use that as a heuristic for whether there is anything worth a release in this push
        # A "bump:" footer forces a release regardless
        run: |
          if echo "${{ steps.changelog.outputs.content }}" | grep -q '#'; then
            echo "Release-worthy changes found"
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ -n "${{ steps.bump.outputs.type }}" ]; then
            echo "Release forced by bump footer"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "No release-worthy changes found"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  release:
    needs: should-release-check
    if: needs.should-release-check.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: src/

      - name: Calculate next version
        id: version_outputs
        # Not git-cliff --bumped-version: it won't bump without release-worthy commits
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          case "${{ needs.should-release-check.outputs.bump_type }}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            *)     VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore src/GithubNugetDemo/GithubNugetDemo.csproj

      - name: Pack NuGet packages
        run: |
          VERSION=${{ steps.version_outputs.outputs.version }}
          dotnet pack src/GithubNugetDemo/GithubNugetDemo.csproj \
            --configuration Release \
            --no-build \
            -p:PackageVersion=$VERSION \
            --output ./nupkgs

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version_outputs.outputs.tag }}
          git push origin ${{ steps.version_outputs.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_outputs.outputs.tag }}
          name: ${{ steps.version_outputs.outputs.tag }}
          body: ${{ needs.should-release-check.outputs.changelog }}
          files: ./nupkgs/*

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Push to nuget.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
